# Proves the adapter against PayPal's sandbox with the repository's sandbox secrets: the
# conformance suite with every request sent to PayPal; 3-D Secure completed in a browser in
# PayPal's card fields, then resumed, and failed, then declined; a shopper who never acts; the
# webhook part: the delivery fixtures verified with a certificate fetched from PayPal, the owner's
# webhook and the run's events listed; and the checkout's PayPal form in a browser, on a site
# installed on the runner. Started by hand or weekly, never by a pull request or a push, so it is
# never a check a merge waits for: a provider's outage must not block one.
#
# SEOCart's extension workflow (extension-ci.yml) takes no secrets, so each job here repeats its
# checkouts: the extension, and SEOCart beside it at the commit chosen as that workflow chooses it
# (core-ref on these events, else the pin read from ext/seocart-core.env when the job runs),
# written once below as YAML anchors with the MySQL service. Each job then sets up with SEOCart's
# action (./seocart/.github/actions/extension-live-setup), which installs everything the job needs
# before its settings step. The steps that are no provider's are SEOCart's,
# seocart/bin/ci/extension-live.sh, read from this plugin's tests/live.php; PayPal's own are
# bin/ci/paypal-sandbox.sh.
#
# Each secret reaches only the steps that need it, through their env. The tests read the
# credentials from one file, readable by its owner alone, in the runner's temporary directory,
# outside the checkout; it is never uploaded, and every job removes it at its end. Nothing is
# committed, pushed or uploaded: a run against PayPal writes its recordings on the runner only,
# and the browser tests take no trace, video or screenshot. A job writes the settings file only
# once it has installed and built everything it needs.
# Every job voids what it left authorized at PayPal; an order nobody approved holds nothing and
# lapses at PayPal by itself, and no job creates, changes or removes a webhook. The part
# tests/live.php states as optional runs nothing without the secret it names, and says why; the
# other parts run.

name: PayPal sandbox

on:
    schedule:
        # Weekly, off the hour. A scheduled run takes the inputs' defaults.
        - cron: '41 5 * * 2'
    workflow_dispatch:
        inputs:
            core-ref:
                description: 'The SEOCart commit to test against: empty for the one ext/seocart-core.env pins, a full commit SHA, or main.'
                type: string
                default: ''
            parts:
                description: 'The parts to run.'
                type: choice
                options:
                    - all
                    - conformance
                    - three-d-secure
                    - webhooks
                    - checkout
                default: all

permissions:
    contents: read

# The sandbox account is shared: one run uses it at a time, and none is cancelled halfway, which
# would leave its authorizations held at PayPal.
concurrency:
    group: paypal-sandbox
    cancel-in-progress: false

env:
    # The WordPress the integration jobs install, as SEOCart's extension workflow does.
    WORDPRESS_VERSION: '7.1'
    # Throwaway values for the MySQL service container, as SEOCart's extension workflow has
    # them: the container lives for one job and is reachable from nowhere else.
    SEOCART_CI_DB_HOST: '127.0.0.1:3306'
    SEOCART_CI_DB_USER: root
    SEOCART_CI_DB_PASSWORD: ci-throwaway
    SEOCART_CI_DB_NAME: seocart_tests

jobs:
    live-conformance:
        if: github.repository == 'cirkuitnet/seocart-gateway-for-paypal' && contains(fromJSON('["all", "conformance"]'), inputs.parts || 'all')
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        outputs:
            ext-head: ${{ steps.heads.outputs.ext-head }}
            core-head: ${{ steps.heads.outputs.core-head }}
            nonce: ${{ steps.run.outputs.nonce }}
            tests: ${{ steps.run.outputs.tests }}
            assertions: ${{ steps.run.outputs.assertions }}
            skipped: ${{ steps.run.outputs.skipped }}
            skip-set: ${{ steps.run.outputs.skip-set }}
        services:
            mysql: &mysql
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: ${{ env.SEOCART_CI_DB_PASSWORD }}
                    MYSQL_DATABASE: ${{ env.SEOCART_CI_DB_NAME }}
                ports:
                    - 3306:3306
                # --host forces TCP: while the image initialises, MySQL listens on its socket
                # only, so the container turns healthy when the real server accepts connections.
                options: >-
                    --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=24
        steps:
            - &checkout-extension
              name: Check out the extension
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: ext
                  persist-credentials: false

            # Before any set-up: a missing secret fails the job at once, naming the secret.
            - &check-secrets
              name: Check the sandbox secrets
              run: sh ext/bin/ci/paypal-sandbox.sh check-secrets
              env:
                  PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
                  PAYPAL_SECRET_KEY: ${{ secrets.PAYPAL_SECRET_KEY }}

            # As SEOCart's extension workflow chooses it: core-ref on a schedule or a dispatch,
            # else the one line SEOCART_CORE_REF=<40 hex> of ext/seocart-core.env, read now, so
            # bin/dev/bump-core.sh moves this workflow's SEOCart with the pin.
            - &choose-core
              name: Choose the SEOCart commit
              id: core
              run: |
                  if [ -n "$CORE_REF" ]; then
                      case $GITHUB_EVENT_NAME in
                          schedule | workflow_dispatch) ;;
                          *)
                              echo "::error::core-ref is refused on a $GITHUB_EVENT_NAME run: only a schedule or workflow_dispatch run may pass core-ref."
                              exit 1
                              ;;
                      esac
                  fi
                  ref=${CORE_REF:-$(sed -n 's/^SEOCART_CORE_REF=\([0-9a-f]\{40\}\)$/\1/p' ext/seocart-core.env)}
                  case $ref in
                      main) ;;
                      *[!0-9a-f]* | '') ref='' ;;
                      *) [ "${#ref}" -eq 40 ] || ref='' ;;
                  esac
                  if [ -z "$ref" ]; then
                      echo "::error::No SEOCart commit to test against: ext/seocart-core.env must hold the line SEOCART_CORE_REF=<40 hexadecimal digits>, and core-ref may only be a commit like it or main."
                      exit 1
                  fi
                  echo "ref=$ref" >>"$GITHUB_OUTPUT"
              env:
                  CORE_REF: ${{ inputs.core-ref }}

            - &checkout-core
              name: Check out SEOCart beside the extension
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: cirkuitnet/seocart
                  ref: ${{ steps.core.outputs.ref }}
                  path: seocart
                  persist-credentials: false

            - &heads
              name: Note the commits under test
              id: heads
              run: sh seocart/bin/ci/extension-live.sh heads ext

            - &setup
              name: Set up PHP, Composer, WordPress and SEOCart's test configuration
              uses: ./seocart/.github/actions/extension-live-setup

            # Written last, just before the tests that read it.
            - &settings
              name: Write the sandbox settings file
              run: sh ext/bin/ci/paypal-sandbox.sh settings
              env:
                  PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
                  PAYPAL_SECRET_KEY: ${{ secrets.PAYPAL_SECRET_KEY }}
                  PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}

            # The suite as the replay runs it, every request sent to PayPal: the tests and the skips
            # tests/live.php states, and no other. The orders it creates are read from the tapes it
            # records onto the run list, which the cleanup works from.
            - name: Run the conformance suite against PayPal's sandbox
              id: run
              run: sh seocart/bin/ci/extension-live.sh conformance ext

            - &cleanup
              name: Void at PayPal what the run left authorized, and remove the settings file
              if: always()
              run: sh ext/bin/ci/paypal-sandbox.sh cleanup

    three-d-secure:
        if: github.repository == 'cirkuitnet/seocart-gateway-for-paypal' && contains(fromJSON('["all", "three-d-secure"]'), inputs.parts || 'all')
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        outputs:
            ext-head: ${{ steps.heads.outputs.ext-head }}
            core-head: ${{ steps.heads.outputs.core-head }}
            tests: ${{ steps.run.outputs.tests }}
            assertions: ${{ steps.run.outputs.assertions }}
            skipped: ${{ steps.run.outputs.skipped }}
            liability-shift: ${{ steps.run.outputs.liability-shift }}
        services:
            mysql: *mysql
        steps:
            - *checkout-extension
            - *check-secrets
            - *choose-core
            - *checkout-core
            - *heads

            - name: Set up PHP, Composer, WordPress, Node.js, the browser scripts' dependencies and Chromium
              uses: ./seocart/.github/actions/extension-live-setup
              with:
                  browser: 'true'

            - *settings

            # 3-D Secure completed in PayPal's card fields, then resumed; failed, then declined under
            # require and authorized under accept; a shopper who never acts; a vaulted card voided.
            - name: Run the 3-D Secure tests against PayPal's sandbox
              id: run
              run: sh seocart/bin/ci/extension-live.sh live ext three-d-secure

            - *cleanup

    webhooks:
        if: github.repository == 'cirkuitnet/seocart-gateway-for-paypal' && contains(fromJSON('["all", "webhooks"]'), inputs.parts || 'all')
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        outputs:
            ext-head: ${{ steps.heads.outputs.ext-head }}
            core-head: ${{ steps.heads.outputs.core-head }}
            webhook-id: ${{ steps.webhook.outputs.webhook-id }}
            tests: ${{ steps.run.outputs.tests }}
            assertions: ${{ steps.run.outputs.assertions }}
            skipped: ${{ steps.run.outputs.skipped }}
            events: ${{ steps.run.outputs.events }}
        services:
            mysql: *mysql
        steps:
            - *checkout-extension
            - *check-secrets
            - *choose-core
            - *checkout-core

            # Whether the repository holds the id of the owner's sandbox webhook, never the id itself:
            # without it the part runs nothing, says why, and the other parts run.
            - name: Check the webhook id
              id: webhook
              run: sh seocart/bin/ci/extension-live.sh optional ext webhooks
              env:
                  PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}

            - *heads
            - *setup
            - *settings

            # The delivery fixtures verified with a certificate fetched from PayPal; the owner's
            # webhook and the run's events listed, read only. Skipped, with the reason the step
            # above printed, while the repository has no webhook id.
            - name: Run the webhook tests against PayPal's sandbox
              id: run
              if: steps.webhook.outputs.webhook-id == 'present'
              run: sh seocart/bin/ci/extension-live.sh live ext webhooks

            - *cleanup

    checkout:
        if: github.repository == 'cirkuitnet/seocart-gateway-for-paypal' && contains(fromJSON('["all", "checkout"]'), inputs.parts || 'all')
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        outputs:
            ext-head: ${{ steps.heads.outputs.ext-head }}
            core-head: ${{ steps.heads.outputs.core-head }}
            tests: ${{ steps.run.outputs.tests }}
            skipped: ${{ steps.run.outputs.skipped }}
            extra-presses: ${{ steps.run.outputs.extra-presses }}
        services:
            mysql: *mysql
        steps:
            - *checkout-extension
            - *check-secrets
            - *choose-core
            - *checkout-core
            - *heads

            - name: Set up PHP, Composer, Node.js, the browser scripts' dependencies and Chromium
              uses: ./seocart/.github/actions/extension-live-setup
              with:
                  wordpress: 'false'
                  browser: 'true'

            # WordPress on PHP's built-in server, SEOCart and this plugin installed from the zips
            # built here: all the job installs and builds, done before the settings file exists.
            - name: Build SEOCart, and install a site with it and the adapter
              run: sh seocart/bin/ci/extension-live.sh site ext

            - *settings

            # From here on nothing is installed or built: the settings file holds the sandbox app's
            # secret.
            - name: Configure the gateway in test mode from the settings file, its webhooks left out
              run: sh ext/bin/ci/paypal-sandbox.sh configure

            # The checkout's PayPal form on SEOCart's payment page: PayPal's script loaded only for a
            # card, a card with no challenge, two presses, a new amount and PayPal's own page; then,
            # the settings asking the bank to check every card, a challenge passed and failed and a
            # reload during it. The PayPal orders the site created go on the run list, which the
            # cleanup works from.
            - name: Run the checkout's PayPal form in a browser against PayPal's sandbox
              id: run
              run: sh ext/bin/ci/paypal-sandbox.sh checkout

            - *cleanup

    verdict:
        needs: [live-conformance, three-d-secure, webhooks, checkout]
        if: always() && github.repository == 'cirkuitnet/seocart-gateway-for-paypal'
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - *checkout-extension
            - *choose-core
            - *checkout-core

            # PHP from the runner's image: the verdict reads only the jobs' results and outputs.
            - name: Judge the run
              run: sh seocart/bin/ci/extension-live.sh verdict ext
              env:
                  SEOCART_LIVE_NEEDS: ${{ toJSON(needs) }}
                  SEOCART_LIVE_PARTS: ${{ inputs.parts || 'all' }}
